[package]
name = "neurolang"
version = "1.0.0"
edition = "2021"
description = "Rust SDK for NeuroLang — neural networks in plain English"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
