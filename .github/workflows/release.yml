name: Release Binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: "NueralNetworkLangauge"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            binary: neurolang-linux-x64
          - os: macos-latest
            target: bun-darwin-arm64
            binary: neurolang-macos-arm64
          - os: macos-13
            target: bun-darwin-x64
            binary: neurolang-macos-x64
          - os: windows-latest
            target: bun-windows-x64
            binary: neurolang-win-x64.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci

      - name: Build standalone binary with Bun
        run: |
          mkdir -p dist-bin
          bun build src/cli.ts \
            --compile \
            --target=${{ matrix.target }} \
            --outfile=dist-bin/${{ matrix.binary }} \
            --external @tensorflow/tfjs

      - name: Make executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x dist-bin/${{ matrix.binary }}

      - name: Sign, notarize and staple macOS .pkg
        if: runner.os == 'macOS' && env.APPLE_APP_CERT_BASE64 != ''
        env:
          APPLE_APP_CERT_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_APP_CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_CERT_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_BASE64 }}
          APPLE_INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          BINARY: ${{ matrix.binary }}
        run: |
          CLEAN_ID=$(echo "$APPLE_ID" | xargs)
          CLEAN_TEAM=$(echo "$APPLE_TEAM_ID" | xargs)
          CLEAN_PASS=$(echo "$APPLE_APP_SPECIFIC_PASSWORD" | xargs)
          CLEAN_APP_IDENTITY=$(echo "$APPLE_SIGNING_IDENTITY" | xargs)

          TMP_DIR=$(mktemp -d)
          KEYCHAIN_PATH="$TMP_DIR/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import Developer ID Application cert (for signing the binary)
          APP_CERT_PATH="$TMP_DIR/app-cert.p12"
          echo "$APPLE_APP_CERT_BASE64" | base64 --decode > "$APP_CERT_PATH"
          security import "$APP_CERT_PATH" -P "$APPLE_APP_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          # Import Developer ID Installer cert (for signing the .pkg)
          INST_CERT_PATH="$TMP_DIR/installer-cert.p12"
          echo "$APPLE_INSTALLER_CERT_BASE64" | base64 --decode > "$INST_CERT_PATH"
          security import "$INST_CERT_PATH" -P "$APPLE_INSTALLER_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Find the installer signing identity from the keychain
          INSTALLER_IDENTITY=$(security find-identity -v -p basic "$KEYCHAIN_PATH" \
            | grep "Developer ID Installer" | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "App identity:       $CLEAN_APP_IDENTITY"
          echo "Installer identity: $INSTALLER_IDENTITY"

          # Entitlements for Bun (JavaScriptCore requires JIT)
          cat > "$TMP_DIR/entitlements.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.allow-jit</key>
            <true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
            <true/>
            <key>com.apple.security.cs.disable-library-validation</key>
            <true/>
          </dict>
          </plist>
          PLIST

          # Sign the binary with Developer ID Application
          /usr/bin/codesign \
            --sign "$CLEAN_APP_IDENTITY" \
            --entitlements "$TMP_DIR/entitlements.plist" \
            --options runtime \
            --timestamp \
            --force \
            "dist-bin/$BINARY"
          codesign --verify --deep --strict "dist-bin/$BINARY"
          echo "Binary signed OK"

          if [ -z "$CLEAN_ID" ]; then
            echo "No APPLE_ID — skipping notarization"
            exit 0
          fi

          # Build the .pkg installer
          PKG_ROOT=$(mktemp -d)
          PKG_SCRIPTS=$(mktemp -d)
          mkdir -p "$PKG_ROOT/usr/local/bin"
          cp "dist-bin/$BINARY" "$PKG_ROOT/usr/local/bin/neurolang"
          chmod +x "$PKG_ROOT/usr/local/bin/neurolang"

          printf '#!/bin/bash\nchmod +x /usr/local/bin/neurolang\n' > "$PKG_SCRIPTS/postinstall"
          chmod +x "$PKG_SCRIPTS/postinstall"

          PKG_NAME="neurolang-installer-${BINARY#neurolang-}.pkg"

          pkgbuild \
            --root "$PKG_ROOT" \
            --scripts "$PKG_SCRIPTS" \
            --identifier "com.neurolang.compiler" \
            --version "${GITHUB_REF_NAME:-1.0.0}" \
            --install-location "/" \
            "$TMP_DIR/unsigned.pkg"

          # Sign the .pkg with Developer ID Installer
          productsign \
            --sign "$INSTALLER_IDENTITY" \
            --keychain "$KEYCHAIN_PATH" \
            "$TMP_DIR/unsigned.pkg" \
            "dist-bin/$PKG_NAME"

          pkgutil --check-signature "dist-bin/$PKG_NAME"
          echo ".pkg signed OK"

          # Notarize the signed .pkg
          xcrun notarytool submit "dist-bin/$PKG_NAME" \
            --wait \
            --apple-id "$CLEAN_ID" \
            --team-id "$CLEAN_TEAM" \
            --password "$CLEAN_PASS" \
            --output-format json > notarize-pkg.json 2>&1 || true

          echo "--- notarytool output ---"
          cat notarize-pkg.json
          echo "-------------------------"

          PKG_STATUS=$(python3 -c "import json; print(json.load(open('notarize-pkg.json')).get('status','unknown'))" 2>/dev/null || echo "parse-error")

          if [ "$PKG_STATUS" = "Accepted" ]; then
            xcrun stapler staple "dist-bin/$PKG_NAME"
            echo "SUCCESS: .pkg notarized and stapled — zero Gatekeeper warnings"
          else
            echo "Notarization status: $PKG_STATUS"
            SUB_ID=$(python3 -c "import json; print(json.load(open('notarize-pkg.json')).get('id',''))" 2>/dev/null || echo "")
            if [ -n "$SUB_ID" ]; then
              xcrun notarytool log "$SUB_ID" \
                --apple-id "$CLEAN_ID" \
                --team-id "$CLEAN_TEAM" \
                --password "$CLEAN_PASS" || true
            fi
          fi

      - name: Ad-hoc sign (fallback — no certificate secrets)
        if: runner.os == 'macOS' && env.APPLE_APP_CERT_BASE64 == ''
        env:
          APPLE_APP_CERT_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        run: codesign --sign - dist-bin/${{ matrix.binary }}

      - name: Test binary
        run: dist-bin/${{ matrix.binary }} --help || true

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: "NueralNetworkLangauge/dist-bin/${{ matrix.binary }}"

      - name: Upload .pkg installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}-pkg
          path: "NueralNetworkLangauge/dist-bin/*.pkg"
        continue-on-error: true

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: binaries/*
          generate_release_notes: true
          draft: false
