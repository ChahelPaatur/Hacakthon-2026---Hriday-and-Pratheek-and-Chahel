name: Release Binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: "NueralNetworkLangauge"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            binary: neurolang-linux-x64
          - os: macos-latest
            target: bun-darwin-arm64
            binary: neurolang-macos-arm64
          - os: macos-13
            target: bun-darwin-x64
            binary: neurolang-macos-x64
          - os: windows-latest
            target: bun-windows-x64
            binary: neurolang-win-x64.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci

      - name: Build standalone binary with Bun
        shell: bash
        run: |
          mkdir -p dist-bin
          bun build src/cli.ts --compile --target=${{ matrix.target }} --outfile=dist-bin/${{ matrix.binary }} --external @tensorflow/tfjs

      - name: Make executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x dist-bin/${{ matrix.binary }}

      # ── Step 1: sign binary + build signed .pkg ──────────────────────────
      - name: Sign binary and build signed .pkg
        if: runner.os == 'macOS' && env.APPLE_APP_CERT_BASE64 != ''
        env:
          APPLE_APP_CERT_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_APP_CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_CERT_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_BASE64 }}
          APPLE_INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          BINARY: ${{ matrix.binary }}
        run: |
          CLEAN_APP_IDENTITY=$(echo "$APPLE_SIGNING_IDENTITY" | xargs)

          TMP_DIR=$(mktemp -d)
          echo "$TMP_DIR" > /tmp/nl_tmpdir

          KEYCHAIN_PATH="$TMP_DIR/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "$KEYCHAIN_PASSWORD" > /tmp/nl_kp
          echo "$KEYCHAIN_PATH"    > /tmp/nl_kc

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_APP_CERT_BASE64" | base64 --decode > "$TMP_DIR/app.p12"
          security import "$TMP_DIR/app.p12" -P "$APPLE_APP_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          echo "$APPLE_INSTALLER_CERT_BASE64" | base64 --decode > "$TMP_DIR/installer.p12"
          security import "$TMP_DIR/installer.p12" -P "$APPLE_INSTALLER_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          INSTALLER_IDENTITY=$(security find-identity -v -p basic "$KEYCHAIN_PATH" \
            | grep "Developer ID Installer" | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "App identity:       $CLEAN_APP_IDENTITY"
          echo "Installer identity: $INSTALLER_IDENTITY"

          cat > "$TMP_DIR/entitlements.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.allow-jit</key>
            <true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
            <true/>
            <key>com.apple.security.cs.disable-library-validation</key>
            <true/>
          </dict>
          </plist>
          PLIST

          /usr/bin/codesign \
            --sign "$CLEAN_APP_IDENTITY" \
            --entitlements "$TMP_DIR/entitlements.plist" \
            --options runtime \
            --timestamp \
            --force \
            "dist-bin/$BINARY"
          codesign --verify --deep --strict "dist-bin/$BINARY"
          echo "Binary signed OK"

          PKG_ROOT=$(mktemp -d)
          PKG_SCRIPTS=$(mktemp -d)
          mkdir -p "$PKG_ROOT/usr/local/bin"
          cp "dist-bin/$BINARY" "$PKG_ROOT/usr/local/bin/neurolang"
          chmod +x "$PKG_ROOT/usr/local/bin/neurolang"
          printf '#!/bin/bash\nchmod +x /usr/local/bin/neurolang\n' > "$PKG_SCRIPTS/postinstall"
          chmod +x "$PKG_SCRIPTS/postinstall"

          PKG_NAME="neurolang-installer-${BINARY#neurolang-}.pkg"
          echo "$PKG_NAME" > /tmp/nl_pkgname

          pkgbuild \
            --root "$PKG_ROOT" \
            --scripts "$PKG_SCRIPTS" \
            --identifier "com.neurolang.compiler" \
            --version "${GITHUB_REF_NAME:-1.0.0}" \
            --install-location "/" \
            "$TMP_DIR/unsigned.pkg"

          productsign \
            --sign "$INSTALLER_IDENTITY" \
            --keychain "$KEYCHAIN_PATH" \
            "$TMP_DIR/unsigned.pkg" \
            "dist-bin/$PKG_NAME"

          pkgutil --check-signature "dist-bin/$PKG_NAME"
          echo ".pkg signed and verified OK"

      # ── Step 2: notarize (non-fatal — Apple log shown on failure) ─────────
      - name: Notarize and staple .pkg
        if: runner.os == 'macOS' && env.APPLE_APP_CERT_BASE64 != '' && env.APPLE_ID != ''
        continue-on-error: true
        env:
          APPLE_APP_CERT_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          BINARY: ${{ matrix.binary }}
        run: |
          CLEAN_ID=$(echo "$APPLE_ID" | xargs)
          CLEAN_TEAM=$(echo "$APPLE_TEAM_ID" | xargs)
          CLEAN_PASS=$(echo "$APPLE_APP_SPECIFIC_PASSWORD" | xargs)
          PKG_NAME=$(cat /tmp/nl_pkgname)

          echo "Submitting dist-bin/$PKG_NAME for notarization..."

          set +e
          xcrun notarytool submit "dist-bin/$PKG_NAME" \
            --apple-id "$CLEAN_ID" \
            --team-id "$CLEAN_TEAM" \
            --password "$CLEAN_PASS" \
            --output-format json > /tmp/nl_submit.json 2>&1
          SUBMIT_EXIT=$?
          set -e

          echo "=== Submit response (exit $SUBMIT_EXIT) ==="
          cat /tmp/nl_submit.json

          SUB_ID=$(python3 -c "import json; print(json.load(open('/tmp/nl_submit.json')).get('id',''))" 2>/dev/null || echo "")
          if [ -z "$SUB_ID" ]; then
            echo "No submission ID — submission failed (exit $SUBMIT_EXIT)"
            exit 1
          fi
          echo "Submission ID: $SUB_ID"

          # Poll up to 10 minutes (set +e so notarytool errors don't kill the script)
          STATUS="In Progress"
          for i in $(seq 1 20); do
            sleep 30
            set +e
            xcrun notarytool info "$SUB_ID" \
              --apple-id "$CLEAN_ID" \
              --team-id "$CLEAN_TEAM" \
              --password "$CLEAN_PASS" \
              --output-format json > /tmp/nl_status.json 2>&1
            POLL_EXIT=$?
            set -e
            echo "=== Poll $i (exit $POLL_EXIT) ==="
            cat /tmp/nl_status.json
            STATUS=$(python3 -c "import json; print(json.load(open('/tmp/nl_status.json')).get('status','unknown'))" 2>/dev/null || echo "unknown")
            echo "Status: $STATUS"
            if [ "$STATUS" = "Accepted" ] || [ "$STATUS" = "Invalid" ] || [ "$STATUS" = "Rejected" ]; then
              break
            fi
          done

          echo "Final status: $STATUS"

          if [ "$STATUS" != "Accepted" ]; then
            echo "=== Apple notarization log ==="
            set +e
            xcrun notarytool log "$SUB_ID" \
              --apple-id "$CLEAN_ID" \
              --team-id "$CLEAN_TEAM" \
              --password "$CLEAN_PASS"
            set -e
            exit 1
          fi

          xcrun stapler staple "dist-bin/$PKG_NAME"
          echo "SUCCESS: .pkg notarized and stapled — zero Gatekeeper warnings"

      - name: Ad-hoc sign (fallback — no certificate secrets)
        if: runner.os == 'macOS' && env.APPLE_APP_CERT_BASE64 == ''
        env:
          APPLE_APP_CERT_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        run: codesign --sign - dist-bin/${{ matrix.binary }}

      - name: Test binary
        run: dist-bin/${{ matrix.binary }} --help || true

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: "NueralNetworkLangauge/dist-bin/${{ matrix.binary }}"

      - name: Upload .pkg installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}-pkg
          path: "NueralNetworkLangauge/dist-bin/*.pkg"
        continue-on-error: true

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: binaries/*
          generate_release_notes: true
          draft: false
