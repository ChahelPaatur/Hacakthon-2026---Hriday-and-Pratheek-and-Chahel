name: Release Binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: "NueralNetworkLangauge"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            binary: neurolang-linux-x64
          - os: macos-latest
            target: bun-darwin-arm64
            binary: neurolang-macos-arm64
          - os: macos-13
            target: bun-darwin-x64
            binary: neurolang-macos-x64
          - os: windows-latest
            target: bun-windows-x64
            binary: neurolang-win-x64.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci

      - name: Build standalone binary with Bun
        run: |
          mkdir -p dist-bin
          bun build src/cli.ts \
            --compile \
            --target=${{ matrix.target }} \
            --outfile=dist-bin/${{ matrix.binary }} \
            --external @tensorflow/tfjs

      - name: Make executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x dist-bin/${{ matrix.binary }}

      - name: Sign, notarize and staple macOS DMG
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          BINARY: ${{ matrix.binary }}
        run: |
          CLEAN_ID=$(echo "$APPLE_ID" | xargs)
          CLEAN_TEAM=$(echo "$APPLE_TEAM_ID" | xargs)
          CLEAN_PASS=$(echo "$APPLE_APP_SPECIFIC_PASSWORD" | xargs)
          CLEAN_IDENTITY=$(echo "$APPLE_SIGNING_IDENTITY" | xargs)

          TMP_DIR=$(mktemp -d)
          KEYCHAIN_PATH="$TMP_DIR/build.keychain-db"
          CERT_PATH="$TMP_DIR/cert.p12"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          cat > "$TMP_DIR/entitlements.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.allow-jit</key>
            <true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
            <true/>
            <key>com.apple.security.cs.disable-library-validation</key>
            <true/>
          </dict>
          </plist>
          PLIST

          /usr/bin/codesign \
            --sign "$CLEAN_IDENTITY" \
            --entitlements "$TMP_DIR/entitlements.plist" \
            --options runtime \
            --timestamp \
            --force \
            "dist-bin/$BINARY"
          codesign --verify --deep --strict "dist-bin/$BINARY"
          echo "Binary signed OK"

          if [ -z "$CLEAN_ID" ]; then
            echo "No APPLE_ID set — skipping notarization"
            exit 0
          fi

          STAGE="$TMP_DIR/dmg-stage"
          mkdir -p "$STAGE"
          cp "dist-bin/$BINARY" "$STAGE/neurolang"
          chmod +x "$STAGE/neurolang"

          cat > "$STAGE/install.sh" << 'INSTALL'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          sudo cp "$DIR/neurolang" /usr/local/bin/neurolang
          sudo chmod +x /usr/local/bin/neurolang
          echo "NeuroLang installed. Run: neurolang --help"
          INSTALL
          chmod +x "$STAGE/install.sh"

          DMG_NAME="${BINARY}.dmg"
          hdiutil create \
            -volname "NeuroLang" \
            -srcfolder "$STAGE" \
            -ov -format UDZO \
            "dist-bin/$DMG_NAME"

          /usr/bin/codesign \
            --sign "$CLEAN_IDENTITY" \
            --timestamp \
            "dist-bin/$DMG_NAME"
          echo "DMG signed OK"

          xcrun notarytool submit "dist-bin/$DMG_NAME" \
            --wait \
            --apple-id "$CLEAN_ID" \
            --team-id "$CLEAN_TEAM" \
            --password "$CLEAN_PASS" \
            --output-format json > notarize-dmg.json 2>&1 || true

          echo "--- notarytool output ---"
          cat notarize-dmg.json
          echo "-------------------------"

          DMG_STATUS=$(python3 -c "import json; print(json.load(open('notarize-dmg.json')).get('status','unknown'))" 2>/dev/null || echo "parse-error")

          if [ "$DMG_STATUS" = "Accepted" ]; then
            xcrun stapler staple "dist-bin/$DMG_NAME"
            echo "SUCCESS: DMG notarized and stapled — zero Gatekeeper warnings"
          else
            echo "Notarization status: $DMG_STATUS — binary still released (signed)"
          fi

      - name: Ad-hoc sign (fallback — no certificate secrets)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE_BASE64 == ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        run: codesign --sign - dist-bin/${{ matrix.binary }}

      - name: Test binary
        run: dist-bin/${{ matrix.binary }} --help || true

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: "NueralNetworkLangauge/dist-bin/${{ matrix.binary }}"

      - name: Upload DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}-dmg
          path: "NueralNetworkLangauge/dist-bin/*.dmg"
        continue-on-error: true

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: binaries/*
          generate_release_notes: true
          draft: false
