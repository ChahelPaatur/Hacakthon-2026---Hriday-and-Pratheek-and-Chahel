name: Release Binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: "NueralNetworkLangauge"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            binary: neurolang-linux-x64
          - os: macos-latest
            target: bun-darwin-arm64
            binary: neurolang-macos-arm64
          - os: macos-13
            target: bun-darwin-x64
            binary: neurolang-macos-x64
          - os: windows-latest
            target: bun-windows-x64
            binary: neurolang-win-x64.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci

      - name: Build standalone binary with Bun
        run: |
          mkdir -p dist-bin
          bun build src/cli.ts \
            --compile \
            --target=${{ matrix.target }} \
            --outfile=dist-bin/${{ matrix.binary }} \
            --external @tensorflow/tfjs

      - name: Make executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x dist-bin/${{ matrix.binary }}

      - name: Sign macOS binary with Developer ID
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          TMP_DIR=$(mktemp -d)
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          KEYCHAIN_PATH="$TMP_DIR/signing.keychain-db"
          CERTIFICATE_PATH="$TMP_DIR/certificate.p12"

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          /usr/bin/codesign --sign "$APPLE_SIGNING_IDENTITY" \
            --timestamp --options runtime --force \
            "dist-bin/${{ matrix.binary }}"

          codesign --verify --deep --strict "dist-bin/${{ matrix.binary }}"

      - name: Ad-hoc sign macOS binary (fallback when no cert)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE_BASE64 == ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        run: codesign --sign - dist-bin/${{ matrix.binary }}

      - name: Notarize macOS binary and build .pkg installer
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE_BASE64 != '' && env.APPLE_ID != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          BINARY: ${{ matrix.binary }}
        run: |
          CLEAN_APPLE_ID=$(echo "$APPLE_ID" | tr -d '[:space:]')
          CLEAN_TEAM_ID=$(echo "$APPLE_TEAM_ID" | tr -d '[:space:]')
          CLEAN_PASSWORD=$(echo "$APPLE_APP_SPECIFIC_PASSWORD" | tr -d '[:space:]')

          zip -j "dist-bin/notarize.zip" "dist-bin/$BINARY"
          xcrun notarytool submit "dist-bin/notarize.zip" \
            --wait \
            --apple-id "$CLEAN_APPLE_ID" \
            --team-id "$CLEAN_TEAM_ID" \
            --password "$CLEAN_PASSWORD" \
            --output-format json > notarization-result.json 2>&1 || true

          STATUS=$(python3 -c "
import json
try: print(json.load(open('notarization-result.json')).get('status','unknown'))
except: print('parse-error')
")
          [ "$STATUS" = "Accepted" ] || { echo "Notarization failed: $STATUS"; exit 1; }
          echo "Binary notarized!"
          rm -f dist-bin/notarize.zip

          # Build .pkg installer (can be stapled — zero Gatekeeper warnings)
          PKG_ROOT=$(mktemp -d)
          PKG_SCRIPTS=$(mktemp -d)
          mkdir -p "$PKG_ROOT/usr/local/bin"
          cp "dist-bin/$BINARY" "$PKG_ROOT/usr/local/bin/neurolang"
          chmod +x "$PKG_ROOT/usr/local/bin/neurolang"
          printf '#!/bin/bash\nchmod +x /usr/local/bin/neurolang\n' > "$PKG_SCRIPTS/postinstall"
          chmod +x "$PKG_SCRIPTS/postinstall"

          PKG_NAME="${BINARY/neurolang-/neurolang-installer-}.pkg"
          PKG_NAME="${PKG_NAME%.exe.pkg}.pkg"

          pkgbuild \
            --root "$PKG_ROOT" \
            --scripts "$PKG_SCRIPTS" \
            --identifier "com.neurolang.compiler" \
            --version "${GITHUB_REF_NAME:-1.0.0}" \
            --install-location "/" \
            "dist-bin/$PKG_NAME"

          zip -j "dist-bin/pkg-notarize.zip" "dist-bin/$PKG_NAME"
          xcrun notarytool submit "dist-bin/pkg-notarize.zip" \
            --wait \
            --apple-id "$CLEAN_APPLE_ID" \
            --team-id "$CLEAN_TEAM_ID" \
            --password "$CLEAN_PASSWORD" \
            --output-format json > pkg-result.json 2>&1 || true

          PKG_STATUS=$(python3 -c "
import json
try: print(json.load(open('pkg-result.json')).get('status','unknown'))
except: print('parse-error')
")
          rm -f dist-bin/pkg-notarize.zip

          if [ "$PKG_STATUS" = "Accepted" ]; then
            xcrun stapler staple "dist-bin/$PKG_NAME"
            echo ".pkg notarized and stapled — zero Gatekeeper warnings!"
          fi

      - name: Test binary
        run: dist-bin/${{ matrix.binary }} --help || true

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: "NueralNetworkLangauge/dist-bin/${{ matrix.binary }}"

      - name: Upload pkg installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}-pkg
          path: "NueralNetworkLangauge/dist-bin/*.pkg"
        continue-on-error: true

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: binaries/*
          generate_release_notes: true
          draft: false
