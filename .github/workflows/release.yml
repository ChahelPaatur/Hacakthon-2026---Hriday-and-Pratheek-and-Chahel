name: Release Binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: "NueralNetworkLangauge"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            binary: neurolang-linux-x64
          - os: macos-latest
            target: macos-arm64
            binary: neurolang-macos-arm64
          - os: macos-13
            target: macos-x64
            binary: neurolang-macos-x64
          - os: windows-latest
            target: win-x64
            binary: neurolang-win-x64.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install postject
        run: npm install postject

      - name: Bundle with esbuild
        run: |
          mkdir -p dist-bin
          npx esbuild src/cli.ts --bundle --platform=node --target=node18 --outfile=dist-bin/neurolang-bundle.cjs --format=cjs --external:@tensorflow/tfjs

      - name: Generate SEA blob
        run: |
          echo '{"main":"dist-bin/neurolang-bundle.cjs","output":"dist-bin/sea-prep.blob","disableExperimentalSEAWarning":true,"useCodeCache":true}' > sea-config.json
          node --experimental-sea-config sea-config.json

      - name: Create executable (Linux)
        if: runner.os == 'Linux'
        run: |
          cp $(which node) dist-bin/${{ matrix.binary }}
          npx postject dist-bin/${{ matrix.binary }} NODE_SEA_BLOB dist-bin/sea-prep.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          chmod +x dist-bin/${{ matrix.binary }}

      - name: Create executable (macOS)
        if: runner.os == 'macOS'
        run: |
          cp $(which node) dist-bin/${{ matrix.binary }}
          codesign --remove-signature dist-bin/${{ matrix.binary }}
          npx postject dist-bin/${{ matrix.binary }} NODE_SEA_BLOB dist-bin/sea-prep.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2 \
            --macho-segment-name NODE_SEA

      - name: Sign macOS binary with Developer ID
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          TMP_DIR=$(mktemp -d)
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          KEYCHAIN_PATH="$TMP_DIR/signing.keychain-db"
          CERTIFICATE_PATH="$TMP_DIR/certificate.p12"

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          /usr/bin/codesign --sign "$APPLE_SIGNING_IDENTITY" \
            --timestamp \
            --options runtime \
            --force \
            --verbose \
            "dist-bin/${{ matrix.binary }}"

          codesign --verify --deep --strict "dist-bin/${{ matrix.binary }}"
          echo "Binary signed successfully with Developer ID"

      - name: Ad-hoc sign macOS binary (fallback)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE_BASE64 == ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        run: |
          codesign --sign - dist-bin/${{ matrix.binary }}
          echo "WARNING: Ad-hoc signed only. Set APPLE_CERTIFICATE_BASE64, APPLE_CERTIFICATE_PASSWORD, and APPLE_SIGNING_IDENTITY secrets for proper signing."

      - name: Notarize macOS binary
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE_BASE64 != '' && env.APPLE_ID != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          zip -j "dist-bin/neurolang-notarize.zip" "dist-bin/${{ matrix.binary }}"

          xcrun notarytool submit "dist-bin/neurolang-notarize.zip" \
            --wait \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --output-format json | tee notarization-result.json

          STATUS=$(cat notarization-result.json | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))")
          if [ "$STATUS" = "Accepted" ]; then
            echo "Notarization successful!"
          else
            echo "Notarization status: $STATUS"
            SUBMISSION_ID=$(cat notarization-result.json | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD"
            exit 1
          fi

          rm -f dist-bin/neurolang-notarize.zip

      - name: Create executable (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Copy-Item (Get-Command node).Source dist-bin/${{ matrix.binary }}
          npx postject dist-bin/${{ matrix.binary }} NODE_SEA_BLOB dist-bin/sea-prep.blob `
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2

      - name: Test executable
        run: dist-bin/${{ matrix.binary }} --help || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: "NueralNetworkLangauge/dist-bin/${{ matrix.binary }}"

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: binaries/*
          generate_release_notes: true
          draft: false
